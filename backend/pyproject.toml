[project]
name = "rootmesh-backend"
version = "1.0.0"
description = "RootMesh — FalkorDB Threat Memory & Incident Response Backend"
requires-python = ">=3.12"

[project.dependencies]
falkordb = ">=1.0.0"
fastapi = ">=0.115"
uvicorn = {extras = ["standard"], version = ">=0.32"}
pydantic = ">=2.9"
pydantic-settings = ">=2.6"
mcp = ">=1.0"
httpx = ">=0.27"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
