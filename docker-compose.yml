version: '3.8'

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: rootmesh-falkordb
    ports:
      - "6379:6379"
      - "3005:3000"
    environment:
      - REDIS_ARGS=--appendonly yes --requirepass rootmeshpass
      - FALKORDB_ARGS=THREAD_COUNT 8 TIMEOUT_MAX 30000
    volumes:
      - falkordb_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "rootmeshpass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rootmesh-backend
    ports:
      - "8000:8000"
    environment:
      - FALKOR_HOST=falkordb
      - FALKOR_PORT=6379
      - FALKOR_PASSWORD=rootmeshpass
      - TENANT_ID=sec_ops_tenant_alpha
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rootmesh-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  falkordb_data:
