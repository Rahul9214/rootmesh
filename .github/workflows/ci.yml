name: RootMesh CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests & FalkorDB Integration
    runs-on: ubuntu-latest

    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Seed Isolated Test Graph in FalkorDB
        run: |
          python backend/seed_threat_graph.py
        env:
          FALKOR_HOST: localhost
          FALKOR_PORT: 6379
          TENANT_ID: sec_ops_tenant_alpha

      - name: Start RootMesh FastAPI Service
        run: |
          cd backend
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 3
        env:
          FALKOR_HOST: localhost
          FALKOR_PORT: 6379
          TENANT_ID: sec_ops_tenant_alpha

      - name: Verify Backend Health Check
        run: |
          curl --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8000/health

      - name: Run PyTest Verification Suite
        run: |
          cd backend
          pytest -v
        env:
          FALKOR_HOST: localhost
          FALKOR_PORT: 6379
          TENANT_ID: sec_ops_tenant_alpha

  frontend-check:
    name: Frontend Lint, Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run Strict TypeScript Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run Next.js 15 Production Build
        run: |
          cd frontend
          npm run build
