name: RootMesh CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Tests & Test Guard Isolation
    runs-on: ubuntu-latest

    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio requests

      - name: Run PyTest Regression Suite on Isolated Test Port 6380
        run: |
          cd backend
          pytest -v
        env:
          FALKOR_HOST: localhost
          FALKOR_PORT: 6380
          TENANT_ID: test_tenant_alpha
          PYTHONPATH: .

  frontend-check:
    name: Frontend Lint, Typecheck, Unit Tests & Standalone Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22.20.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run Strict TypeScript Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run Frontend Unit & Truthfulness Test Suite
        run: |
          cd frontend
          npm test

      - name: Run Next.js 15 Standalone Production Build
        run: |
          cd frontend
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Verify Standalone Distribution Assets
        run: |
          cd frontend
          test -f .next/standalone/public/brand/rootmesh-wordmark.png || exit 1
          test -f .next/standalone/public/brand/rootmesh-icon.png || exit 1
          echo "[✓] Standalone distribution assets verified successfully."
